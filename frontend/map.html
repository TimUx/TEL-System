<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagekarte - TEL</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <div class="map-container">
        <div class="map-sidebar-left">
            <h3>Im Einsatz</h3>
            <div id="deployedVehicles" data-testid="map-deployed"></div>
        </div>

        <div id="map" data-testid="map-canvas">
            <div class="map-header">
                <h2>Lagekarte</h2>
                <p id="selectedAssignmentInfo">Alle aktiven Aufträge</p>
            </div>
        </div>

        <div class="map-sidebar-right">
            <h3>Verfügbare Fahrzeuge</h3>
            <div id="availableVehicles" data-testid="map-available"></div>
            <h3 class="map-sidebar-section">Nicht verfügbar</h3>
            <div id="unavailableVehicles" data-testid="map-unavailable"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/tactical-symbols.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/status-utils.js"></script>
    <script src="js/vehicle-assignment-utils.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
