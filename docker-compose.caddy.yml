# Optional reverse proxy overlay
# Example:
# docker compose -f docker-compose.prod.yml -f docker-compose.caddy.yml up -d

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tel_network
    depends_on:
      frontend:
        condition: service_healthy

  backend:
    ports: []

  frontend:
    ports: []

volumes:
  caddy_data:
  caddy_config:
